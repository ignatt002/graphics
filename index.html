      if (config.axisY) obstacles.push({type:'line', isAxis: true, x1:mapX(0), y1:mapY(mathBottom), x2:mapX(0), y2:mapY(mathTop)});
      
      if (config.drawMainLine) {
         for (let i=0; i<config.mainSequence.length-1; i++) addLineObstacle(config.mainSequence[i], config.mainSequence[i+1]);
         if (config.mainSequence.length > 2) addLineObstacle(config.mainSequence[config.mainSequence.length-1], config.mainSequence[0]);
      }
      
      config.extraLines.forEach(l => {
         addLineObstacle(config.pointByName[l.charAt(0)], config.pointByName[l.charAt(1)]);
      });
      config.segments.forEach(seg => addLineObstacle(config.pointByName[seg.name.charAt(0)], config.pointByName[seg.name.charAt(1)]));

      if (config.freeLines) {
         config.freeLines.forEach(fl => {
            for (let i = 0; i < fl.points.length - 1; i++) {
               obstacles.push({
                  type: 'line',
                  x1: mapX(fl.points[i].x),
                  y1: mapY(fl.points[i].y),
                  x2: mapX(fl.points[i + 1].x),
                  y2: mapY(fl.points[i + 1].y)
               });
            }
         });
      }

      config.allPoints.forEach(p => {
         const ptPx = getPtPx(p);
         obstacles.push({type:'box', x: ptPx.x, y: ptPx.y, w: 14, h: 14});
      });

      config.hatching.forEach(h => {
         let p1 = config.pointByName[h.from]; let p2 = config.pointByName[h.to];
         let yH = p1 ? p1.y : (p2 ? p2.y : 0);
         const canvasW = mathRight - mathLeft;
         let x1 = h.from === '-inf' ? mathLeft - canvasW : (p1 ? p1.x : parseFloat(h.from));
         let x2 = h.to === '+inf' ? mathRight + canvasW : (p2 ? p2.x : parseFloat(h.to));
         if (x1 > x2) { let t = x1; x1 = x2; x2 = t; }
         obstacles.push({type:'box', isHatching: true, x: (mapX(x1)+mapX(x2))/2, y: mapY(yH) - 13, w: Math.abs(mapX(x2)-mapX(x1))+40, h: 30});
      });
      
      config.tickMarks.forEach(t => {
         obstacles.push({type:'box', x: mapX(t.x), y: mapY(t.y) + 16, w: 20, h: 20});
      });

      if (config.texts && config.texts.length > 0) {
         config.texts.forEach(t => {
            const px = mapX(t.x);
            const py = mapY(t.y);
            const w = t.fieldWidth ? (t.fieldWidth <= 80 ? t.fieldWidth * 8.5 : t.fieldWidth) : ((t.text ? t.text.length : 5) * 8.5);
            obstacles.push({
               type: 'box',
               x: t.align === 'start' ? px + w/2 : (t.align === 'end' ? px - w/2 : px),
               y: py,
               w: w,
               h: 24
            });
         });
      }

      // Add circle outlines as obstacles to avoid overlap
      if (config.circDataInscribed && config.inscribedVisible !== false) {
         obstacles.push({
            type: 'circle-outline',
            cx: mapX(config.circDataInscribed.cx),
            cy: mapY(config.circDataInscribed.cy),
            r: config.circDataInscribed.r * scale
         });
      }
      if (config.circDataCircumscribed && config.circumscribedVisible !== false) {
         obstacles.push({
            type: 'circle-outline',
            cx: mapX(config.circDataCircumscribed.cx),
            cy: mapY(config.circDataCircumscribed.cy),
            r: config.circDataCircumscribed.r * scale
         });
      }
      if (circData && config.circle && config.circle.visible) {
         obstacles.push({
            type: 'circle-outline',
            cx: mapX(circData.cx),
            cy: mapY(circData.cy),
            r: circData.r * scale
         });
      }

      function placeSmartLabel(p) {
           const ptPx = getPtPx(p);
           const px = ptPx.x;
           const py = ptPx.y;
           let str = p.name;
           if (str.match(/^-?[A-Za-z0-9_]+$/)) str = '$' + str + '$';
           
           const w = 24; const h = 24;
           const isZeroY = Math.abs(p.y) < 0.01;
           const offsets = isZeroY ? [
              {dx: 0, dy: -20},   // top
              {dx: 16, dy: -20},  // top-right
              {dx: -16, dy: -20}, // top-left
              {dx: 0, dy: -36},   // higher top
              {dx: 16, dy: -36},  // higher top-right
              {dx: -16, dy: -36}  // higher top-left
           ] : [
              {dx: 0, dy: -20}, // top
              {dx: 18, dy: -18},// top-right
              {dx: -18, dy: -18},// top-left
              {dx: 0, dy: 22},  // bottom
              {dx: 18, dy: 18}, // bottom-right
              {dx: -18, dy: 18},// bottom-left
              {dx: 24, dy: 0},  // right
              {dx: -24, dy: 0}, // left
           ];
           
           let startIdx = 0;
           const dupIdx = pointDupIdx.get(p) || 0;
           if (dupIdx > 0) {
              startIdx = 0; // stack labels upwards above the stacked point
           } else if (isZeroY) {
              startIdx = 0; // точки на высоте y=0 (координатная прямая) пишутся строго сверху
           } else if (config.axisY && Math.abs(p.x) < 0.01) {
              startIdx = 6; // points on axis Y should preferably go right
           }

           function check(cx, cy) {
              for (const o of obstacles) {
                 if (o.type === 'box') {
                    // Игнорируем собственную точку (dot на координате графически смещенного центра)
                    if (Math.abs(o.x - px) < 1 && Math.abs(o.y - py) < 1 && o.w === 14 && o.h === 14) {
                       continue;
                    }
                    // Для точек на y=0 штриховка не должна выталкивать название точки
                    if (isZeroY && o.isHatching) {
                       continue;
                    }
                    if (Math.abs(cx - o.x) * 2 < (w + o.w) && Math.abs(cy - o.y) * 2 < (h + o.h)) return true;
                 } else if (o.type === 'line') {
                    if (o.isAxis) {
                       continue;
                    }
                    const l2 = (o.x2 - o.x1)**2 + (o.y2 - o.y1)**2;
                    let t = l2 === 0 ? 0 : ((cx - o.x1)*(o.x2 - o.x1) + (cy - o.y1)*(o.y2 - o.y1)) / l2;
                    t = Math.max(0, Math.min(1, t));
                    const projX = o.x1 + t * (o.x2 - o.x1);
                    const projY = o.y1 + t * (o.y2 - o.y1);
                    if ((cx - projX)**2 + (cy - projY)**2 < 12 * 12) return true; // 12px radius from text center
                  } else if (o.type === 'circle-outline') {
                     const dist = Math.sqrt((cx - o.cx)**2 + (cy - o.cy)**2);
                     if (Math.abs(dist - o.r) < 14) return true; // Keep center of text at least 14px away from circle line
                 } else if (o.type === 'angle-sector') {
                     const dx = cx - o.cx;
                     const dy = cy - o.cy;
                     const dist = Math.hypot(dx, dy);
                     if (dist < o.r + 16) {
                        const a = Math.atan2(dy, dx);
                        let rel = a - o.startAng;
                        while (rel < 0) rel += 2 * Math.PI;
                        while (rel >= 2 * Math.PI) rel -= 2 * Math.PI;
                        if (rel <= o.sweepAngle) return true;
                     }
                 }
              }
              return false;
           }

           let bestIdx = startIdx;
           for(let i=0; i<offsets.length; i++) {
              let idx = (startIdx + i) % offsets.length;
              let off = offsets[idx];
              let cx = px + off.dx;
              let cy = py + off.dy;
              if (!check(cx, cy)) { bestIdx = idx; break; }
           }
           let best = offsets[bestIdx];
           
           let finalCx = px + best.dx;
           let finalCy = py + best.dy;
           if (dupIdx > 0 && isZeroY) finalCy -= dupIdx * 20;
           obstacles.push({type:'box', x:finalCx, y:finalCy, w: 26, h: 26});

           return mathNodePx(finalCx, finalCy, str, 'middle', 'middle', THEME.text);
      }

      config.allPoints.forEach(p => {
        if (config.pointsInvisibleAll) return;
        if (config.invisiblePoints && config.invisiblePoints.includes(p.name)) return;
        
        let isHollow = false;
        if (config.hollowPoints && config.hollowPoints.includes(p.name)) isHollow = true;
        if (config.filledPoints && config.filledPoints.includes(p.name)) isHollow = false;
        
        const ptPx = getPtPx(p);
        if (isHollow) {
          svgElements += tag('circle', {cx: ptPx.x.toFixed(1), cy: ptPx.y.toFixed(1), r: 7.5, fill: THEME.bg, stroke: THEME.point, 'stroke-width': 3});
        } else {
          svgElements += tag('circle', {cx: ptPx.x.toFixed(1), cy: ptPx.y.toFixed(1), r: 6, fill: THEME.point, stroke: 'none', 'stroke-width': 0});
        }
        
        if (p.name && !p.hideLabel && !p.name.startsWith('_dynamic')) {
          if (!config.invisibleLabelPoints || !config.invisibleLabelPoints.includes(p.name)) {
             svgElements += placeSmartLabel(p);
          }
        }
      });

      if (config.texts && config.texts.length > 0) {
        const INLINE_COLOR_MAP = {
          'г': '#38bdf8', 'c': '#38bdf8',
          'ж': '#facc15', 'y': '#facc15',
          'к': '#fb7185', 'r': '#fb7185',
          'з': '#4ade80', 'g': '#4ade80',
          'с': '#60a5fa', 'b': '#60a5fa',
          'сер': '#AFAFAF', 'серый': '#AFAFAF', 'gray': '#AFAFAF', 'grey': '#AFAFAF'
        };
        const inlineColorRegex = /\\{2}(серый|сер|gray|grey|[гжкзсycrgb])\s*([\s\S]+?)\s*\\{2}(?:\1|(?=[^a-zа-яё]|$))/gi;

        config.texts.forEach(item => {
          const px = mapX(item.x);
          const py = mapY(item.y);
          const fontSize = item.fontSize || 14;
          const col = item.color || '#AFAFAF';
          const align = item.align || 'middle';

          let rawText = item.text || '';
          const hasKatex = typeof window !== 'undefined' && window.katex && rawText.includes('$');
          const hasInlineColor = /\\{2}(серый|сер|gray|grey|[гжкзсycrgb])\s*[\s\S]+?\s*\\{2}(?:\1|(?=[^a-zа-яё]|$))/i.test(rawText);

          let renderedHtml = rawText;
          if (hasKatex) {
            renderedHtml = rawText.replace(/\$([^$]+)\$/g, (m, expr) => {
              try {
                return window.katex.renderToString(expr.trim(), { throwOnError: false });
              } catch (e) {
                return m;
              }
            });
          } else {
            renderedHtml = rawText
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');
          }

          if (hasInlineColor) {
            renderedHtml = renderedHtml.replace(inlineColorRegex, (match, tag, inner) => {
              const hCol = INLINE_COLOR_MAP[tag.toLowerCase()] || '#AFAFAF';
              return `<span style="color:${hCol};">${inner}</span>`;
            });
          }

          const cleanTextForLength = rawText
            .replace(/\\{2}(серый|сер|gray|grey|[гжкзсycrgb])\s*/gi, '')
            .replace(/\\{2}\s*/g, '');

          if (item.fieldWidth != null || hasKatex || hasInlineColor || rawText.includes('\n')) {
            let fieldPx;
            if (item.fieldWidth != null) {
              fieldPx = item.fieldWidth <= 80 ? Math.round(item.fieldWidth * (fontSize * 0.62)) : Math.round(item.fieldWidth);
            } else {
              fieldPx = Math.max(120, Math.min(W - 40, (cleanTextForLength.length + 4) * (fontSize * 0.65)));
            }

            let boxX = px;
            let tAlign = 'center';
            if (align === 'start' || align === 'left') {
              boxX = px;
              tAlign = 'left';
            } else if (align === 'end' || align === 'right') {
              boxX = px - fieldPx;
              tAlign = 'right';
            } else {
              boxX = px - fieldPx / 2;
              tAlign = 'center';
            }

            const charsPerLine = item.fieldWidth != null ? (item.fieldWidth <= 80 ? item.fieldWidth : Math.max(1, Math.floor(fieldPx / (fontSize * 0.62)))) : Math.max(1, cleanTextForLength.length);
            const lineCount = Math.max(1, Math.ceil((cleanTextForLength.length || 1) / charsPerLine));
            const approxHeight = Math.max(fontSize * 1.3, lineCount * fontSize * 1.35);
            const boxY = py - (approxHeight / 2);
            const boxH = Math.max(approxHeight + 30, 80);

            svgElements += tag('foreignObject', {
              x: boxX.toFixed(1),
              y: boxY.toFixed(1),
              width: fieldPx.toFixed(1),
              height: boxH.toFixed(1),
              style: 'overflow: visible; pointer-events: none;'
            }, `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${fieldPx}px;color:${col};font-family:'Nunito',sans-serif;font-size:${fontSize}px;font-weight:700;text-align:${tAlign};line-height:1.25;word-wrap:break-word;overflow-wrap:break-word;white-space:normal;">${renderedHtml}</div>`);
          } else {
            let svgAnchor = 'middle';
            if (align === 'start' || align === 'left') svgAnchor = 'start';
            else if (align === 'end' || align === 'right') svgAnchor = 'end';

            svgElements += tag('text', {
              x: px.toFixed(1),
              y: py.toFixed(1),
              fill: col,
              'text-anchor': svgAnchor,
              'dominant-baseline': 'central',
              style: `font-family: 'Nunito', sans-serif; font-size: ${fontSize}px; font-weight: 700;`
            }, renderedHtml);
          }
        });
      }

      return {
          html: `<svg width="100%" height="100%" viewBox="0 0 ${W} ${H}" style="display:block; user-select: none;">${svgElements}</svg>`,
          W: W,
          H: H
      };
    }
  };

  global.FiveCoreGraph = FiveCoreGraph;

})(typeof window !== 'undefined' ? window : this);

// Обработчик сообщений от конструктора:
const container = document.getElementById('graph-container');
let currentDestroy = null;

window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'render') {
        if (currentDestroy) {
            currentDestroy();
            currentDestroy = null;
        }
        container.innerHTML = '';

        try {
            const result = FiveCoreGraph.render(container, event.data.commands);
            
            if (result && typeof result.destroy === 'function') {
                currentDestroy = result.destroy;
            }

            // Сообщаем родительской странице реальные пропорции получившегося графика
            const ratioStr = container.style.aspectRatio;
            if (ratioStr) {
                const parts = ratioStr.split('/').map(s => parseFloat(s.trim()));
                if (parts.length === 2 && parts[0] > 0 && parts[1] > 0) {
                    window.parent.postMessage({ type: 'graph-size', ratio: parts[0] / parts[1] }, '*');
                }
            }
        } catch (err) {
            console.error("Ошибка при отрисовке:", err);
            container.innerHTML = `<div style="color: red; padding: 20px; font-family: sans-serif;">
                Ошибка отрисовки: ${err.message}
            </div>`;
        }
    }
});
    </script>
</body>
